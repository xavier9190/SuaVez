<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua Vez — Referência de telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens — Identidade Visual v1 + formas do hi-fi */
:root{
  --teal:#0E8C7F; --teal-deep:#0A6B61; --mist:#E3F1EE;
  --sol:#F5A524; --sol-soft:#FEF1D8; --sol-ink:#8A5A00;
  --ink:#13222E; --muted:#5A6B77; --faint:#8A979D; --line:#DAE5E3; --bg:#F4F8F7; --surface:#fff;
  --coral:#E2574C; --coral-ink:#C23D32; --slate:#8796A5; --leaf:#2E9E5B;
  --display:"Outfit",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  --r-card:24px; --r-ctl:16px; --r-pill:999px;
  --shadow:0 1px 2px rgba(19,34,46,.05),0 4px 14px rgba(19,34,46,.04);
  --av1:#D9F2EC; --av2:#DDEBFA; --av3:#FDEFD3; --av4:#F2E3F7;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:#E3EAE8;color:var(--ink);padding:32px 16px 64px}
h1.doc{font:700 24px var(--display);text-align:center}
p.doc{color:var(--muted);text-align:center;margin:6px auto 32px;font-size:14px;max-width:640px}
.grid{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start}
figcaption{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;text-align:center}

.phone{width:390px;min-height:844px;background:var(--bg);border:1px solid var(--line);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.content{flex:1;padding:8px 24px 28px;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* App bar */
.appbar{height:56px;padding:0 24px;display:flex;align-items:center;gap:8px;flex:none;margin-top:6px}
.lock{display:flex;align-items:center;gap:6px;font:600 21px/1 var(--display);letter-spacing:-.02em}
.lock svg{width:28px;height:28px}
.lock b{font-weight:600;color:var(--teal)}
.appbar .house{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.appbar .house:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--faint)}
.appbar .avatar{margin-left:auto}
.subbar{height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;flex:none;margin-top:6px}
.subbar h1{font:700 22px/28px var(--display);flex:1}
.round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.round.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.round.soft{background:var(--mist);border-color:transparent;color:var(--teal-deep)}

/* Type */
.page-title{font:700 28px/34px var(--display);letter-spacing:-.01em}
.title{font:600 20px/26px var(--display)}
.item-title{font:600 16px/22px var(--display)}
.meta{font-size:13px;line-height:18px;color:var(--muted)}
.body{font-size:15px;line-height:22px;color:var(--muted)}
.overline{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label{font-size:14px;font-weight:500;line-height:20px}
.code{font:700 26px/30px var(--display);letter-spacing:.1em}
.pts{color:var(--teal);font-family:var(--display);font-weight:600;white-space:nowrap}

/* Buttons (pílula) */
.btn{height:48px;width:100%;border-radius:var(--r-pill);font:600 16px/20px var(--body);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid transparent;background:none;color:inherit}
.btn:active{filter:brightness(.93)}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:14px}
.btn.primary{background:var(--teal);color:#fff}
.btn.tonal{background:var(--mist);color:var(--teal-deep)}
.btn.secondary{border:1.5px solid var(--teal);color:var(--teal)}
.btn.neutral{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.destructive{border:1.5px solid var(--coral);color:var(--coral)}
.btn.dashed{border:1.5px dashed #B9CFCB;color:var(--teal-deep);background:rgba(255,255,255,.6)}
.btn.ghost{color:var(--muted)}
.btn.pegar{width:84px;padding:0}

.field{display:flex;flex-direction:column;gap:6px}
.input{height:52px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);padding:0 16px;font:400 16px var(--body);color:var(--ink);width:100%}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border:1.5px solid var(--teal)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-h .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sep{border-top:1px solid var(--line);margin:16px -16px 0;padding:16px 16px 0}

.chip{height:26px;padding:0 11px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.info{background:var(--mist);color:var(--teal-deep)}
.chip.admin{background:var(--mist);color:var(--teal-deep);box-shadow:inset 0 0 0 1px rgba(14,140,127,.28)}
.chip.vez{background:var(--sol-soft);color:var(--sol-ink)}
.chip.ok{background:color-mix(in srgb,var(--leaf) 15%,#fff);color:var(--leaf)}
.chip.eyebrow{background:var(--sol-soft);color:var(--sol-ink);letter-spacing:.04em}
.chip svg{width:13px;height:13px}

.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 15px var(--display);color:var(--teal-deep);flex:none;position:relative}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.lg{width:56px;height:56px;font-size:20px}

/* Esforço: Leve ≤3 · Média 4–6 · Pesada ≥7 */
.ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--mist);color:var(--teal)}
.ico.pesada{background:color-mix(in srgb,var(--coral) 12%,#fff);color:var(--coral)}
.ico.media{background:var(--sol-soft);color:#B97800}
.ico svg{width:22px;height:22px}
.eff{height:28px;padding:0 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;font:700 14px var(--display);white-space:nowrap}
.eff.pesada{background:color-mix(in srgb,var(--coral) 12%,#fff);color:var(--coral-ink)}
.eff.media{background:var(--sol-soft);color:var(--sol-ink)}
.eff.leve{background:var(--mist);color:var(--teal-deep)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--teal)}
.dot.pesada{background:var(--coral)} .dot.media{background:var(--sol)}

/* Progresso */
.bar{height:10px;border-radius:var(--r-pill);background:var(--mist);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .teal{background:linear-gradient(90deg,#0A6B61,#0E8C7F)}
.bar .amber{background:linear-gradient(90deg,#F5A524,#FBC66B)}
.bar .amber-soft{background:color-mix(in srgb,var(--sol) 45%,#fff)}
.bar.thick{height:12px}

/* Cota */
.cota .big{font:700 40px/1 var(--display);color:var(--teal);letter-spacing:-.02em}
.cota .big small{font:500 16px var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:500}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--teal)}
.legend span.p:before{background:color-mix(in srgb,var(--sol) 65%,#fff)}

/* Tarefa */
.task{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.task.vez{box-shadow:inset 5px 0 0 var(--sol),var(--shadow);background:linear-gradient(90deg,rgba(245,165,36,.11),#fff 45%)}
.task .chip.vez{margin-bottom:4px;height:22px;padding:0 9px}
.task.done{box-shadow:var(--shadow);background:#fff}
.task.done .item-title{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.task.done .ico,.task.done .eff{opacity:.55}
.task.done .chip.vez{display:none}
.cb{width:28px;height:28px;border-radius:9px;border:2px solid #B4C4C1;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.cb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .cb{background:var(--teal);border-color:var(--teal)}
.task.done .cb svg{opacity:1}

/* Placar */
.rank{display:flex;align-items:center;gap:12px}
.avwrap{position:relative;flex:none}
.star{position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--sol);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.star svg{width:10px;height:10px;fill:currentColor}
.pill-pts{font:700 15px var(--display);color:var(--teal);white-space:nowrap}
.rank.me .pill-pts{color:var(--sol-ink)}
.rank.me .avatar{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--sol)}
.scores{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.rank .grow{display:flex;flex-direction:column;gap:7px}

/* Ritmo */
.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg.r{width:60px;height:60px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--teal)}
.ring .in svg{width:22px;height:22px}
.pct{font:700 28px/1 var(--display);color:var(--teal)}
.faixa{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:12px 14px}
.stackav{display:flex}
.stackav .avatar{width:32px;height:32px;font-size:12px;border:2px solid #fff;margin-left:-8px}
.stackav .avatar:first-child{margin-left:0}
.mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .ico{width:36px;height:36px}.mini .ico svg{width:18px;height:18px}

/* Tab bar com pílula */
.tabs{height:72px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--faint)}
.tab .pi{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--teal-deep);font-weight:700}
.tab.on .pi{background:var(--mist)}
.tab.on svg{fill:rgba(14,140,127,.25);color:var(--teal)}

.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:64px 0 8px;font:600 36px/1 var(--display);letter-spacing:-.02em}
.logo b{font-weight:600;color:var(--teal)}
.logo svg{width:48px;height:48px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}
.kebab{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:0;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--bg)}
.note{display:flex;align-items:center;gap:10px;background:var(--mist);color:var(--teal-deep);border-radius:var(--r-ctl);padding:12px 14px;font-size:13px;font-weight:500}

/* Segmentado só em Preferências */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;height:48px}
.seg button{flex:1;border:0;background:none;border-radius:var(--r-pill);font:500 14px var(--body);color:var(--muted);cursor:pointer}
.seg button.on{font-weight:600}
.seg button.on.odeio{background:color-mix(in srgb,var(--coral) 14%,#fff);color:var(--coral-ink);box-shadow:inset 0 0 0 1.5px var(--coral)}
.seg button.on.tanto{background:color-mix(in srgb,var(--slate) 22%,#fff);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--slate)}
.seg button.on.gosto{background:color-mix(in srgb,var(--leaf) 14%,#fff);color:var(--leaf);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.pref-group{display:flex;flex-direction:column;gap:8px}

/* Sheet + opções */
.dim{position:absolute;inset:0;background:rgba(19,34,46,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:12px 24px 28px;display:flex;flex-direction:column;gap:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{height:40px;padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:#fff;font:600 14px var(--body);color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--teal);background:var(--mist);color:var(--teal-deep)}
.opt.e-media.on{border-color:var(--sol);background:var(--sol-soft);color:var(--sol-ink)}
.opt.e-pesada.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,#fff);color:var(--coral-ink)}
</style>
</head>
<body>

      <circle cx="50" cy="50" r="40" stroke="#0E8C7F" stroke-dasharray="56 195.3"/>
      <circle cx="50" cy="50" r="40" stroke="#0E8C7F" stroke-dasharray="56 195.3" transform="rotate(120 50 50)"/>

</svg>

<h1 class="doc">Sua Vez — Referência das telas (v3)</h1>
<p class="doc">Telas longas aparecem completas. Interativo: marcar tarefas (reordena e recalcula a cota), Pegar, preferências, chips dos formulários e Copiar.</p>

<div class="grid">

<!-- 1 Login -->
<figure><figcaption>1 · Login</figcaption>
<div class="phone">
  <div class="content">
    <div class="logo"><svg viewBox="0 0 100 100"><use href="#mark"/></svg><span>sua <b>vez</b></span></div>
    <div class="stack" style="gap:16px">
      <div class="field"><label class="label">E-mail</label><input class="input" placeholder="voce@email.com"></div>
      <div class="field"><label class="label">Senha</label><input class="input" type="password" placeholder="Senha"></div>
      <button class="btn primary">Entrar</button>
    </div>
    <div class="divider">ou</div>
    <div class="stack">
      <button class="btn neutral"><svg class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 12h6"/></svg>Entrar com o Google</button>
      <button class="btn neutral">Criar conta</button>
    </div>
  </div>
</div></figure>

<!-- 2 Sua casa -->
<figure><figcaption>2 · Sua casa (sem casa)</figcaption>
<div class="phone">
  <div class="appbar"><div class="lock"><svg viewBox="0 0 100 100"><use href="#mark"/></svg><span>sua <b>vez</b></span></div><div class="avatar sm" style="background:var(--av1)">AN</div></div>
  <div class="content">
    <div><div class="page-title">Sua casa</div><p class="body" style="margin-top:6px">Crie a casa ou entre com um código de convite.</p></div>
    <button class="btn primary">Criar casa</button>
    <div class="divider">ou</div>
    <div class="field"><label class="label">Código de convite</label><input class="input" placeholder="Digite o código"></div>
    <button class="btn secondary">Entrar na casa</button>
  </div>
  <nav class="tabs">
    <div class="tab"><span class="pi"><svg><use href="#i-tasks"/></svg></span>Tarefas</div>
    <div class="tab"><span class="pi"><svg><use href="#i-sliders"/></svg></span>Preferências</div>
    <div class="tab on"><span class="pi"><svg><use href="#i-home"/></svg></span>Casa</div>
    <div class="tab"><span class="pi"><svg><use href="#i-user"/></svg></span>Perfil</div>
  </nav>
</div></figure>

<!-- 3a Tarefas -->
<figure><figcaption>3a · Tarefas (tela inicial)</figcaption>
<div class="phone">
  <div class="appbar"><div class="lock"><svg viewBox="0 0 100 100"><use href="#mark"/></svg><span>sua <b>vez</b></span></div><span class="house">Casa dos amigos</span><div class="avatar sm" style="background:var(--av1)">AN</div></div>
  <div class="content">

    <div><div class="page-title">Bom dia, Ana</div><div class="meta" style="margin-top:2px">Semana 43 · 3 moradores</div></div>

    <div class="card cota stack" style="gap:14px">

<script>
/* Tarefas: marcar/desmarcar reordena (concluídas descem) e recalcula a cota */
const list=document.getElementById('mylist');
function recalc(){
  const t=[...list.querySelectorAll('.task')];
  const tot=t.reduce((s,x)=>s+ +x.dataset.pts,0);
  const done=t.filter(x=>x.classList.contains('done')).reduce((s,x)=>s+ +x.dataset.pts,0);
  const pend=t.filter(x=>!x.classList.contains('done')).length;
  document.getElementById('doneTxt').textContent=done;
  document.getElementById('totTxt').textContent=tot;
  document.getElementById('barDone').style.width=(done/tot*100)+'%';
  document.getElementById('barPend').style.width=((tot-done)/tot*100)+'%';
  document.getElementById('pendChip').textContent=pend+(pend===1?' pendente':' pendentes');
  document.getElementById('pendChip2').textContent=(tot-done)+' pts pendentes';
}
list.querySelectorAll('.cb').forEach(cb=>cb.addEventListener('click',()=>{
  const card=cb.closest('.task'); const on=!card.classList.contains('done');
  card.classList.toggle('done',on); cb.setAttribute('aria-checked',on);
  if(on){list.appendChild(card)}
  else{const firstDone=list.querySelector('.task.done'); list.insertBefore(card,firstDone||null)}
  recalc();
}));
document.querySelectorAll('.pegar').forEach(b=>b.addEventListener('click',()=>{b.textContent='Sua ✓';b.disabled=true;b.style.opacity='.6'}));
document.querySelectorAll('[data-opts]').forEach(g=>g.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{
  g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');
})));
document.querySelectorAll('[data-pref] button').forEach(b=>b.addEventListener('click',()=>{
  b.parentElement.querySelectorAll('button').forEach(x=>x.className=''); b.className='on '+b.dataset.k;
}));
const copy=document.getElementById('copy');
copy.addEventListener('click',()=>{
  try{navigator.clipboard.writeText('SV-7824')}catch(e){}
  const s=copy.querySelector('span'); s.textContent='Copiado ✓'; setTimeout(()=>s.textContent='Copiar código',2000);
});
</script>
